<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DentalLocal</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/jpeg" href="logo.jpg" />
    <link href="DentalLocal.Client.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <script>
        (function () {
            try {
                var mode = localStorage.getItem('dental-theme-mode') || 'light';
                var accent = localStorage.getItem('dental-theme-accent') || 'blue';
                document.documentElement.setAttribute('data-theme', mode);
                document.documentElement.setAttribute('data-accent', accent);
            } catch (e) { /* no-op */ }
        })();
    </script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        Произошла непредвиденная ошибка.
        <a href="." class="reload">Обновить</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/download.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/draftAutosave.js"></script>
    <script src="js/idleTracker.js"></script>
</body>

</html>
